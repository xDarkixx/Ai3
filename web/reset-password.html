<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI3 – Passwort zurücksetzen</title><body style="font-family:system-ui;max-width:620px;margin:10vh auto;padding:24px;background:#070b18;color:#eef2ff"><h1>Neues Passwort</h1><form id="f"><input id="p" type="password" minlength="12" required placeholder="Neues Passwort" style="display:block;width:100%;padding:12px;margin:12px 0"><button style="padding:12px 18px">Passwort ändern</button></form><p id="s"></p><script>f.onsubmit=async e=>{e.preventDefault();const t=new URLSearchParams(location.search).get('token');const r=await fetch('/v1/auth/password-reset/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t,password:p.value})});const d=await r.json();s.textContent=r.ok?'✓ Passwort geändert. Bitte neu anmelden.':(d.detail||'Fehler');if(r.ok)f.remove()}</script></body></html>
