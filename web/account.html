<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b18"><title>AI3 // Mein Konto</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#eef2ff;background:#070b18}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,#182044,transparent 40%),#070b18}.wrap{max-width:1180px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-weight:900;font-size:25px}.brand span{color:#8b9cff}.back{color:#b8c1e8;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:rgba(18,25,50,.86);border:1px solid #29345f;border-radius:20px;padding:24px;box-shadow:0 20px 60px #0005}.wide{grid-column:1/-1}h1{font-size:38px;margin:0 0 8px}h2{margin:0 0 12px}p{color:#aeb8db}input{width:100%;margin-top:7px;padding:13px;border-radius:11px;border:1px solid #35426f;background:#0b1127;color:white}button{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer;background:#7183ff;color:white}.danger{background:#6d2638}.row{display:flex;gap:10px;flex-wrap:wrap}.status{padding:12px;border-radius:12px;background:#0b1228;margin:7px 0}.ok{border-left:4px solid #54d69a}.pending{border-left:4px solid #e5b95c}.muted{font-size:13px;color:#8994ba}.agent{padding:14px;border:1px solid #29345f;border-radius:12px;margin-top:10px}.hidden{display:none}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.wrap{padding:18px}h1{font-size:30px}}</style></head><body><div class="wrap"><div class="top"><div class="brand">AI<span>3</span> <small>ACCOUNT</small></div><a class="back" href="/web/index.html">← AI3 Command Center</a></div><h1 id="hello">Mein Konto</h1><p>Profil, Sicherheit, Identität und deine AI3-Agents zentral verwalten.</p><div class="grid"><section class="card"><h2>Profil</h2><div id="profile"></div><p class="muted">Persönliche Profildaten werden verschlüsselt gespeichert.</p></section><section class="card"><h2>Sicherheit</h2><div id="security"></div><div class="row"><button onclick="verifyMail()">E-Mail bestätigen</button><button onclick="location.href='/web/identity.html'">🪪 Identität verifizieren</button><button class="danger" onclick="logout()">Abmelden</button></div></section><section class="card wide"><h2>Meine Agents</h2><div id="agents"></div><div class="row" style="margin-top:14px"><input id="agentName" placeholder="Neuer Agent-Name"><button onclick="createAgent()">＋ Agent erstellen</button></div></section></div></div><script>const S=sessionStorage.getItem('ai3_user_session');const H={'X-AI3-User-Session':S||''};if(!S)location.href='/web/register.html';async function api(u,o={}){o.headers={...(o.headers||{}),...H,'Content-Type':'application/json'};const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||d.message||'Fehler');return d}async function load(){try{const m=await api('/v1/user/me');document.querySelector('#hello').textContent='Hallo, '+m.username;document.querySelector('#profile').innerHTML='<b>'+esc(m.username)+'</b><br>'+((m.email||'keine E-Mail'));document.querySelector('#agents').innerHTML=m.agents.length?m.agents.map(a=>'<div class="agent"><b>'+esc(a.name)+'</b><br><span class="muted">ID '+a.id+' · '+(a.active?'aktiv':'inaktiv')+'</span><div class="row" style="margin-top:8px"><button onclick="newToken('+a.id+')">Token erstellen</button></div></div>').join(''):'<p>Noch keine Agents vorhanden.</p>';const s=await api('/v1/user/security');document.querySelector('#security').innerHTML='<div class="status '+(s.email_verified?'ok':'pending')+'">E-Mail: '+(s.email_verified?'✓ bestätigt':'○ nicht bestätigt')+'</div><div class="status '+(s.identity.status==='verified'?'ok':'pending')+'">Identität: '+(s.identity.status==='verified'?'✓ verifiziert':'○ '+esc(s.identity.status||'unverifiziert'))+'</div>'}catch(e){alert(e.message)}}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function verifyMail(){try{const d=await api('/v1/auth/email/verify/request',{method:'POST'});alert(d.sent?'Eine Bestätigungs-E-Mail wurde versendet.':'SMTP ist noch nicht eingerichtet. Konfiguriere AI3_SMTP_* auf dem Server.')}catch(e){alert(e.message)}}async function createAgent(){const n=document.querySelector('#agentName').value.trim();if(!n)return;try{await api('/v1/user/agents',{method:'POST',body:JSON.stringify({name:n})});document.querySelector('#agentName').value='';load()}catch(e){alert(e.message)}}async function newToken(id){try{const d=await api('/v1/user/agents/'+id+'/tokens',{method:'POST'});prompt('Diesen Token jetzt kopieren – er wird nicht erneut angezeigt:',d.token)}catch(e){alert(e.message)}}async function logout(){try{await api('/v1/auth/logout',{method:'POST'})}catch(e){}sessionStorage.removeItem('ai3_user_session');location.href='/web/register.html'}load();</script></body></html>
