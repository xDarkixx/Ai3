<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI3 Control Center</title><style>body{margin:0;background:#070b18;color:#eef2ff;font:15px system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px}.hero{padding:28px;border:1px solid #27345d;border-radius:24px;background:#111a35}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:18px}.card{padding:22px;border:1px solid #27345d;border-radius:18px;background:#0e152c}.ok{color:#72f1a8}.warn{color:#ffd166}.muted{color:#91a0c9}.bar{height:8px;border-radius:8px;background:#202b4d;overflow:hidden}.fill{height:100%;width:72%;background:#7183ff}button{padding:11px 15px;border:0;border-radius:10px;background:#7183ff;color:white;font-weight:800;cursor:pointer;margin-top:8px}</style></head>
<body><main class="wrap"><section class="hero"><h1>AI3 Control Center</h1><p class="muted">Eigener KI-, Benutzer-, Zertifikats-, Verifizierungs- und Infrastruktur-Server.</p><div class="grid"><div class="card"><h3>🔐 PKI</h3><p class="ok">● Eigene CA aktiv</p><button onclick="load('/v1/pki/ca')">Status prüfen</button></div><div class="card"><h3>🪪 Own Verification</h3><p>Keine eID / kein externer KYC-Anbieter.</p><button onclick="load('/v1/admin/verifications')">Verifizierungen laden</button></div><div class="card"><h3>🤖 Lokale KI</h3><p>Ollama / lokales Modell</p><div class="bar"><div class="fill"></div></div></div><div class="card"><h3>✉️ Eigene Mail</h3><p class="warn">DNS, PTR/rDNS und Port 25 prüfen</p><button onclick="alert('Mail-Diagnose wird über den Installer/Doctor ausgeführt.')">Diagnose</button></div></div></section><section class="card" style="margin-top:18px"><h2>Systemausgabe</h2><pre id="out" class="muted">Bereit.</pre></section></main><script>async function load(u){try{const r=await fetch(u);document.querySelector('#out').textContent=JSON.stringify(await r.json(),null,2)}catch(e){document.querySelector('#out').textContent='Nicht erreichbar: '+e}}</script></body></html>
