<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI3 – E-Mail bestätigen</title><body style="font-family:system-ui;max-width:620px;margin:12vh auto;padding:24px;background:#070b18;color:#eef2ff"><h1>AI3 E-Mail-Verifizierung</h1><p id="s">Wird geprüft …</p><a href="/web/register.html" style="color:#9aa8ff">Zum Login</a><script>(async()=>{const t=new URLSearchParams(location.search).get('token');if(!t){s.textContent='Kein Verifizierungstoken vorhanden.';return}try{const r=await fetch('/v1/auth/email/verify?token='+encodeURIComponent(t),{method:'POST'});const d=await r.json();s.textContent=r.ok?'✓ E-Mail erfolgreich bestätigt.':(d.detail||'Token ungültig oder abgelaufen.')}catch(e){s.textContent='Verifizierung fehlgeschlagen.'}})()</script></body></html>
