name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      AI3_ENABLE_ADVANCED_SECURITY: "1"
      AI3_ADMIN_KEY: "ci-test-admin-key"
      AI3_ADMIN_PASSWORD: ""
      AI3_DB: "/tmp/ai3-ci.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate shell scripts
        run: bash -n scripts/*.sh install.sh AI3-Install.run
      - name: Validate fresh-install bootstrap
        run: |
          test -s AI3-Install.run
          test -s install.sh
          test -s scripts/install-ubuntu.sh
          test -s scripts/ensure-host-deps.sh
          grep -q 'github.com/xDarkixx/Ai3' AI3-Install.run
          grep -q 'archive/refs/heads' AI3-Install.run
          grep -q 'scripts/install-ubuntu.sh' AI3-Install.run
          grep -q 'github.com/xDarkixx/Ai3.git' install.sh
          grep -q 'ensure-host-deps.sh' scripts/install-ubuntu.sh
          grep -q 'docker-ce' scripts/ensure-host-deps.sh
          grep -q 'docker-compose-plugin' scripts/ensure-host-deps.sh
          grep -q 'nvidia-container-toolkit' scripts/ensure-host-deps.sh
          grep -q 'Ubuntu-Version ab 24.04' docs/INSTALL-UBUNTU.md
          echo 'fresh-install bootstrap: OK'
      - name: Validate Ubuntu release policy
        run: |
          grep -q '24|25|26' AI3-Install.run
          grep -q '24|25|26' scripts/install-ubuntu.sh
          grep -q 'Ubuntu 24.04+' README.md
          grep -q 'Ubuntu 24.04 und neuere' docs/INSTALL-UBUNTU.md
          echo 'Ubuntu 24.04+ policy: OK'
      - name: Validate updater and web agent
        run: |
          python -m py_compile update_agent.py
          test -s scripts/update-ai3.sh
          test -s systemd/ai3-auto-update.service
          test -s systemd/ai3-auto-update.timer
          grep -q 'git fetch' scripts/update-ai3.sh
          grep -q 'git pull --ff-only' scripts/update-ai3.sh
          grep -q 'ensure-host-deps.sh' scripts/update-ai3.sh
          grep -q 'flock' scripts/update-ai3.sh
          grep -q '/health' scripts/update-ai3.sh
          grep -q 'rollback' scripts/update-ai3.sh || grep -q 'Rollback' scripts/update-ai3.sh
          grep -q 'ai3-update-agent' docker-compose.override.yml
          echo 'updater contract: OK'
      - name: Validate web assets
        run: |
          test -s web/index.html
          test -s web/app.js
          test -s web/style.css
          test -s web/branding.js
          test -s web/updates.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('web/index.html').read_text(encoding='utf-8')
          assert '/web/style.css' in html
          assert '/web/app.js' in html
          assert '/web/branding.js' in html
          assert '/web/updates.js' in html
          for asset in re.findall(r'(?:href|src)="(/web/[^"?#]+)', html):
              assert Path('.' + asset).is_file(), asset
          print('web assets: OK')
          PY
      - name: Validate network metadata contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          compose = Path('docker-compose.yml').read_text()
          public = Path('docker-compose.public.yml').read_text()
          override = Path('docker-compose.override.yml').read_text()
          caddy = Path('Caddyfile').read_text()
          refresh = Path('scripts/network-refresh.sh').read_text()
          branding = Path('web/branding.js').read_text()
          assert 'AI3_LAN_HOSTNAME:' in compose and 'AI3_LAN_HOSTNAME:-localhost' in compose
          assert 'AI3_LAN_IP:' in compose and 'AI3_LAN_IP:-127.0.0.1' in compose
          assert './runtime:/runtime:ro' in compose
          assert './runtime:/runtime:ro' in public
          assert './runtime:/runtime' in override
          assert '/__ai3/network-info.json' in caddy
          assert '/__ai3/update/' in caddy
          assert 'lan-info.json' in refresh
          assert 'router_changes_automatic' in refresh
          assert '/__ai3/network-info.json' in branding
          sample = {'hostname':'AI3-PC','ip':'192.168.1.20','interface':'enp1s0','gateway':'192.168.1.1','updated_at':'2026-01-01T00:00:00Z','router_target':{'tcp':[80,443]},'automatic_lan_refresh':True,'router_changes_automatic':False}
          encoded = json.dumps(sample)
          assert 'AI3_ADMIN_KEY' not in encoded
          assert 'AI3_ADMIN_PASSWORD' not in encoded
          print('network metadata contract: OK')
          PY
      - name: Validate Docker Compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.override.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.public.yml config -q
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e AI3_DOMAIN=localhost \
            -e AI3_LAN_HOSTNAME=ai3-ci \
            -e AI3_LAN_IP=127.0.0.1 \
            -e AI3_TLS_EMAIL= \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/runtime:/runtime:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Run tests
        run: python -m pytest -q
