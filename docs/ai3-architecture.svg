<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<rect width="1400" height="760" rx="32" fill="#0b1020"/>
<text x="70" y="82" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">AI3 — Self-Hosted AI &amp; Mail Platform</text>
<text x="70" y="122" fill="#aab4cf" font-family="Arial,sans-serif" font-size="21">One-click Ubuntu deployment • local AI • own PKI • own mail • automatic restart</text>
<g font-family="Arial,sans-serif">
<rect x="70" y="190" width="260" height="150" rx="24" fill="#151d36" stroke="#6677aa" stroke-width="2"/><text x="200" y="245" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">Internet / Clients</text><text x="200" y="282" text-anchor="middle" fill="#aab4cf" font-size="18">Browser • App • Agent</text><text x="200" y="312" text-anchor="middle" fill="#aab4cf" font-size="18">OpenClaw • API</text>
<rect x="400" y="170" width="270" height="190" rx="24" fill="#18233d" stroke="#7d90c7" stroke-width="2"/><text x="535" y="225" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">Caddy</text><text x="535" y="260" text-anchor="middle" fill="#aab4cf" font-size="18">HTTPS / TLS</text><text x="535" y="290" text-anchor="middle" fill="#aab4cf" font-size="18">80 / 443</text><text x="535" y="320" text-anchor="middle" fill="#aab4cf" font-size="18">automatic renewal</text>
<rect x="740" y="160" width="300" height="210" rx="24" fill="#172c31" stroke="#62a5a0" stroke-width="2"/><text x="890" y="215" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">AI3 Gateway</text><text x="890" y="252" text-anchor="middle" fill="#b5d5d2" font-size="18">Tokens • Users • Agents</text><text x="890" y="282" text-anchor="middle" fill="#b5d5d2" font-size="18">Encryption • Limits</text><text x="890" y="312" text-anchor="middle" fill="#b5d5d2" font-size="18">Own Verification • PKI</text><text x="890" y="342" text-anchor="middle" fill="#b5d5d2" font-size="18">OpenAI-compatible API</text>
<rect x="1110" y="160" width="220" height="210" rx="24" fill="#292139" stroke="#a98dcc" stroke-width="2"/><text x="1220" y="215" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">Ollama</text><text x="1220" y="252" text-anchor="middle" fill="#c9b8dd" font-size="18">Local models</text><text x="1220" y="282" text-anchor="middle" fill="#c9b8dd" font-size="18">CPU / GPU</text><text x="1220" y="312" text-anchor="middle" fill="#c9b8dd" font-size="18">No AI API fee</text>
<rect x="400" y="470" width="270" height="170" rx="24" fill="#332a1c" stroke="#c5a36a" stroke-width="2"/><text x="535" y="525" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">Own Mail</text><text x="535" y="558" text-anchor="middle" fill="#e0cda8" font-size="18">SMTP 25/465/587</text><text x="535" y="588" text-anchor="middle" fill="#e0cda8" font-size="18">IMAP / POP3 / Sieve</text><text x="535" y="618" text-anchor="middle" fill="#e0cda8" font-size="18">Webmail</text>
<rect x="740" y="470" width="300" height="170" rx="24" fill="#1e2b21" stroke="#7cad83" stroke-width="2"/><text x="890" y="525" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">Storage &amp; Security</text><text x="890" y="558" text-anchor="middle" fill="#b9d4bd" font-size="18">SQLite • encrypted data</text><text x="890" y="588" text-anchor="middle" fill="#b9d4bd" font-size="18">Backups • healthchecks</text><text x="890" y="618" text-anchor="middle" fill="#b9d4bd" font-size="18">restart: unless-stopped</text>
<path d="M330 265H400M670 265H740M1040 265H1110M535 360V470M890 370V470" stroke="#dbe4ff" stroke-width="5" fill="none" marker-end="url(#a)"/>
<path d="M670 555H740" stroke="#dbe4ff" stroke-width="5" fill="none" marker-end="url(#a)"/>
</g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dbe4ff"/></marker></defs>
<text x="70" y="705" fill="#aab4cf" font-family="Arial,sans-serif" font-size="18">Manual work target: router/firewall port forwarding only. Public DNS/domain and ISP port-25 policy remain external network prerequisites.</text>
</svg>
