services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
      AI3_MODEL: ${AI3_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull \"$${AI3_MODEL}\""]
    restart: "no"

  ai3-token-server:
    build: .
    restart: unless-stopped
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      AI3_DB: /data/ai3.db
      AI3_ADMIN_KEY: ${AI3_ADMIN_KEY}
      AI3_LLM_BASE_URL: ${AI3_LLM_BASE_URL:-http://ollama:11434/v1}
      AI3_LLM_API_KEY: ${AI3_LLM_API_KEY:-}
      AI3_LLM_TIMEOUT: ${AI3_LLM_TIMEOUT:-300}
    volumes:
      - ai3-data:/data

volumes:
  ai3-data:
  ollama-data:
