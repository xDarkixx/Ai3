services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
      AI3_MODEL: ${AI3_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull \"$${AI3_MODEL}\""]
    restart: "no"

  # Self-hosted EUDI identity stack. No commercial KYC provider is required.
  # The verifier/trust-validator are European Commission open-source reference components.
  # Production use still requires HTTPS, proper access certificates/trust configuration,
  # hardening and any applicable regulatory/certification requirements.
  eudi-trust-validator:
    image: ghcr.io/eu-digital-identity-wallet/eudi-srv-trust-validator:latest
    restart: unless-stopped
    expose:
      - "8080"

  eudi-verifier:
    image: ghcr.io/eu-digital-identity-wallet/eudi-srv-verifier-endpoint:0.9.0
    restart: unless-stopped
    depends_on:
      - eudi-trust-validator
    environment:
      SERVER_PORT: 8080
      VERIFIER_PUBLICURL: ${AI3_EUDI_PUBLIC_URL:-https://ai3.example.com/eudi}
      VERIFIER_DEFAULTHTTPRESPONSEMODE: DirectPost
      VERIFIER_TRUSTVALIDATOR_SERVICEURL: http://eudi-trust-validator:8080/trust
      VERIFIER_ATTESTATIONCLASSIFICATIONS: '{"pid":{"vcts":[],"docTypes":["eu.europa.ec.eudi.pid.1"]},"qeaa":{"vcts":[],"docTypes":[]},"pubeaa":{"vcts":[],"docTypes":[]},"eaa":[]}'
    expose:
      - "8080"

  ai3-token-server:
    build: .
    restart: unless-stopped
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      eudi-verifier:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      AI3_DB: /data/ai3.db
      AI3_ADMIN_KEY: ${AI3_ADMIN_KEY}
      AI3_ADMIN_PASSWORD: ${AI3_ADMIN_PASSWORD:-}
      AI3_ADMIN_SESSION_HOURS: ${AI3_ADMIN_SESSION_HOURS:-12}
      AI3_PUBLIC_BASE_URL: ${AI3_PUBLIC_BASE_URL:-}
      AI3_EUDI_PUBLIC_URL: ${AI3_EUDI_PUBLIC_URL:-}
      AI3_EUDI_VERIFIER_URL: http://eudi-verifier:8080
      AI3_LLM_BASE_URL: ${AI3_LLM_BASE_URL:-http://ollama:11434/v1}
      AI3_LLM_API_KEY: ${AI3_LLM_API_KEY:-}
      AI3_LLM_TIMEOUT: ${AI3_LLM_TIMEOUT:-300}
      AI3_OLLAMA_URL: http://ollama:11434
      AI3_ENABLE_ADVANCED_SECURITY: ${AI3_ENABLE_ADVANCED_SECURITY:-1}
      AI3_ACCESS_TOKEN_MINUTES: ${AI3_ACCESS_TOKEN_MINUTES:-15}
      AI3_REFRESH_TOKEN_DAYS: ${AI3_REFRESH_TOKEN_DAYS:-30}
      AI3_RATE_LIMIT_RPM: ${AI3_RATE_LIMIT_RPM:-120}
      AI3_DAILY_REQUEST_LIMIT: ${AI3_DAILY_REQUEST_LIMIT:-0}
      AI3_DDOS_IP_RPM: ${AI3_DDOS_IP_RPM:-120}
      AI3_DDOS_MAX_CONCURRENT_PER_IP: ${AI3_DDOS_MAX_CONCURRENT_PER_IP:-20}
      AI3_MAX_REQUEST_BYTES: ${AI3_MAX_REQUEST_BYTES:-2000000}
      AI3_MAX_CHAT_STORAGE_BYTES: ${AI3_MAX_CHAT_STORAGE_BYTES:-2000000}
      AI3_DATA_ENCRYPTION_KEY_FILE: /run/secrets/ai3_data_key
      AI3_BACKUP_DIR: /data/backups
    secrets:
      - ai3_data_key
    volumes:
      - ai3-data:/data

  ai3-api-server:
    build: .
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
    ports:
      - "127.0.0.1:8090:8090"
    command: ["uvicorn", "api_server:api", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      AI3_DB: /data/ai3.db
      AI3_ADMIN_KEY: ${AI3_ADMIN_KEY}
      AI3_ADMIN_PASSWORD: ${AI3_ADMIN_PASSWORD:-}
      AI3_OLLAMA_URL: http://ollama:11434
      AI3_DATA_ENCRYPTION_KEY_FILE: /run/secrets/ai3_data_key
    secrets:
      - ai3_data_key
    volumes:
      - ai3-data:/data

secrets:
  ai3_data_key:
    file: ./secrets/ai3_data_encryption_key

volumes:
  ai3-data:
  ollama-data:
