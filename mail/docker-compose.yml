services:
  poste-mail:
    image: analogic/poste.io:latest
    restart: unless-stopped
    hostname: mail.${AI3_DOMAIN:-localhost}
    network_mode: host
    environment:
      TZ: ${TZ:-Europe/Berlin}
      HTTPS: OFF
      HTTP_PORT: 8081
    volumes:
      - poste-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  poste-data:
