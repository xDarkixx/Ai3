services:
  poste-mail:
    image: analogic/poste.io:latest
    restart: unless-stopped
    hostname: mail.${AI3_DOMAIN:-localhost}
    environment:
      TZ: ${TZ:-Europe/Berlin}
      HTTPS: OFF
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "110:110"
      - "143:143"
      - "993:993"
      - "995:995"
      - "4190:4190"
    volumes:
      - poste-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ai3-public

volumes:
  poste-data:

networks:
  ai3-public:
    external: true
